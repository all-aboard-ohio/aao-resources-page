name: Sync Resources and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_routes:
        description: Use the committed route manifest instead of the previous deployment (first migration or disaster recovery only)
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Find the previous successful Pages deployment
        id: previous
        if: ${{ !inputs.bootstrap_routes }}
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'github-pages', per_page: 100
            });
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 100
              });
              const success = statuses.find(status => status.state === 'success');
              if (success) {
                if (!success.environment_url) throw new Error('Previous Pages URL unavailable');
                core.setOutput('routes_url', new URL('data/routes.json', success.environment_url.endsWith('/') ? success.environment_url : success.environment_url + '/').href);
                break;
              }
            }
      - name: Export the complete public Wix snapshot
        id: snapshot
        run: npm run sync
        env:
          WIX_CLIENT_ID: ${{ secrets.WIX_CLIENT_ID || '9559f2fe-3c4f-418d-97dc-fe3e6996d980' }}
          PREVIOUS_ROUTES_URL: ${{ steps.previous.outputs.routes_url }}
      - name: Decide whether a deployment is needed
        id: decision
        env:
          CHANGED: ${{ steps.snapshot.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$EVENT_NAME" != "schedule" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Lint
        run: npm run lint
      - name: Cache optimized image variants
        if: steps.decision.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/thumbnails
          key: wix-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/optimize-images.mjs') }}-${{ steps.snapshot.outputs.hash }}
          restore-keys: |
            wix-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/optimize-images.mjs') }}-
      - name: Test content rendering and normalization
        run: npm test
      - name: Generate and verify static pages
        if: steps.decision.outputs.deploy == 'true'
        run: npm run build:static
      - uses: actions/upload-pages-artifact@v3
        if: steps.decision.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
